services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: saathi
      POSTGRES_PASSWORD: saathi
      POSTGRES_DB: saathi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saathi"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://saathi:saathi@db:5432/saathi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
